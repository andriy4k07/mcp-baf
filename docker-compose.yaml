# mcp-baf (read-only 1С) як мережевий сервіс: streamable-http за TLS на :8001/mcp.
#   cp .env.example .env   # 1С-креди й mcp_baf_HTTP_TOKEN
#   docker compose up -d --build
# Сертифікат: свій (mcp_baf_TLS_CERT/KEY, змонтуйте файли) або згенерований CA
# у томі mcp-baf-tls — клієнтам: docker compose cp mcp-baf:/data/tls/ca.crt .
services:
  mcp-baf:
    build: .
    image: mcp-baf:local
    # Ім'я хоста потрапляє в SAN згенерованого сертифіката.
    hostname: mcp-baf
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      mcp_baf_TRANSPORT: ${mcp_baf_TRANSPORT:-https}
      mcp_baf_HTTP_HOST: 0.0.0.0
      mcp_baf_HTTP_PORT: 8001
    ports:
      # За замовчуванням лише localhost хоста; MCP_BAF_BIND=0.0.0.0 — для доступу з мережі.
      - "${MCP_BAF_BIND:-127.0.0.1}:${MCP_BAF_PUBLISHED_PORT:-8001}:8001"
    volumes:
      - mcp-baf-data:/data
      - mcp-baf-tls:/data/tls
      # Вивантаження конфігурації для search_code (+ mcp_baf_DUMP_DIR=/dump у .env):
      # - ${MCP_BAF_DUMP_HOST_DIR:-../1c-dump}:/dump:ro
    extra_hosts:
      # 1С на тому ж хості: mcp_baf_BASE_URL=http://host.docker.internal:8080/hs/mcp-baf
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Лише живість процесу: локальний запит без перевірки сертифіката, 401 = живий.
      test: ["CMD", "python", "-c", "import http.client as c,ssl,os; s=os.environ.get('mcp_baf_TRANSPORT')=='https'; x=(c.HTTPSConnection('127.0.0.1',8001,timeout=3,context=ssl._create_unverified_context()) if s else c.HTTPConnection('127.0.0.1',8001,timeout=3)); x.request('GET','/mcp'); x.getresponse()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mcp-baf-data:
  mcp-baf-tls:
