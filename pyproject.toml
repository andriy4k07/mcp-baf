[project]
name = "mcp-baf"
version = "0.3.0"
description = "MCP server for BAF data, metadata, platform help and BSL analysis"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "andriy4k07" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    # https-транспорт: самоподписанный CA (tls.py); приходит и через mcp,
    # но импортируется напрямую.
    "cryptography>=42,<51",
    # Импортируются напрямую (config/__main__/server/tools), но раньше
    # приходили транзитивно через mcp — объявляем явно, чтобы pip ставил
    # именно то, на что рассчитан код.
    "pydantic>=2.12,<3",
    "uvicorn>=0.31,<1",
    "anyio>=4.9,<5",
    # Пользовательский regex в search_code исполняется с timeout= (ReDoS, #61).
    "regex>=2024.11.6,<2027",
    # Корневой набор CA для httpx/ssl. Ниже 2026.10.23 — скомпрометированные
    # промежуточные CA (GHSA-6q48-6c7w-9gw2).
    "certifi>=2026.10.23",
    # Общий контракт аудита (schema v2: канонические события, one_c.http,
    # сквозной trace_id). В монорепо ставится из ../mcp-baf-audit
    # (pip install -e ../mcp-baf-audit); пин по тегу: mcp-baf-audit==0.2.1
    # (pip install "git+<repo>/mcp-baf-audit.git@v0.2.1").
    # `~=` ограничивает сверху: SCHEMA_VERSION='2' — часть контракта audit.log,
    # minor bump 0.3 может сменить формат. Гард — tests/test_dependency_bounds.py.
    "mcp-baf-audit~=0.2.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mcp-baf = "mcp_baf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_baf"]
