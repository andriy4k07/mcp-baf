name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Контрактные протокольные тесты — в отдельном джобе protocol-tests:
      # их сегфолт (issue #56) не должен отравлять сигнал по всему сьюту,
      # и наоборот — фоновые потоки из остальных файлов не должны влиять
      # на teardown stdio/asyncio-сессий в test_protocol.py.
      - name: Run test suite (кроме test_protocol.py)
        env:
          # См. protocol-tests: плавающий краш интерпретатора (issue #56)
          # должен оставить faulthandler-дамп в логе и в основном джобе,
          # если тест туда мигрирует.
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests/ -q --ignore=tests/test_protocol.py

  protocol-tests:
    # Изолированный прогон tests/test_protocol.py (issue #56): чистый
    # интерпретатор без предыдущих тестовых файлов, faulthandler включён.
    # Без ретраев: повтор скрыл бы именно тот сегфолт, который чинит #56.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run protocol contract tests (isolated)
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail  # иначе tee замаскирует код возврата pytest
          python -m pytest tests/test_protocol.py -q -p no:cacheprovider 2>&1 | tee protocol-pytest.log
      - name: Upload protocol test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-pytest-log-${{ matrix.python-version }}
          path: protocol-pytest.log
          if-no-files-found: ignore
